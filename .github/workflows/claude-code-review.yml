name: Claude Code Review

# Runs on PRs INTO this repo. We use pull_request_target (not pull_request) so
# that the workflow definition always comes from the base branch, never from
# the PR's own head - a plain `pull_request` run uses whatever workflow file
# is on the PR branch itself, which a same-repo feature branch could modify to
# steal secrets before this ever runs.
#
# SECURITY: pull_request_target runs in the BASE repo with secrets and a
# write-capable token. The job is gated to PRs authored by jnasbyupgrade only
# — CLAUDE_CODE_OAUTH_TOKEN is tied to their personal Claude account, and this
# repo has other collaborators (e.g. decibel) whose PRs shouldn't burn it.
# github.event.pull_request.user.login is the PR's original author and can't
# be spoofed by PR content, so this check holds regardless of whether the PR
# head lives in this repo or an external fork (an arbitrary external fork
# still can't trigger this secret-bearing job unless it's actually
# jnasbyupgrade's own fork). The workflow file always comes from the base
# branch (master), so a PR cannot modify the reviewer that runs on it. The
# checkout step below fetches the BASE ref only, never the PR head -
# claude-code-action fetches and reads the PR's actual content itself,
# internally, via the base repo's own refs/pull/<n>/head (see its
# docs/security.md). Checking out the PR head directly here would put
# untrusted fork content in the workspace for no reason, and actions/checkout
# refuses to do so anyway under pull_request_target without an explicit
# (and here unnecessary) allow-unsafe-pr-checkout: true opt-in.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Cheap gate that skips the paid review when this push's PATCH is
  # identical to the last one reviewed for this PR - a pure gh-stack rebase
  # cascade changes only the base commit, not the PR's own diff, so there's
  # nothing new to review. Restricted to `synchronize`: `opened`/`reopened`/
  # `ready_for_review` always run the review regardless of patch-id, since
  # draft->ready is itself a meaningful trigger even if nothing about the
  # diff needed to change, and comparing against a stale cached patch-id
  # there would otherwise wrongly suppress it. Runs before the (slow) "wait
  # for CI" gate in claude-review below, so a rebase-only push never enters
  # that wait at all.
  content-check:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == 'jnasbyupgrade'
    outputs:
      content_changed: ${{ steps.diff.outputs.changed }}
    steps:
      # Default (non-overridden) checkout for a pull_request_target event
      # is the BASE branch - deliberate here: bin/patch_id_hash must be on
      # disk to run, and an older PR predating this script (checked out at
      # its own head, as claude-review's later step does) wouldn't have it.
      # The script itself diffs base...head via git plumbing on commit
      # objects, not the working tree, so which ref is checked out doesn't
      # affect the computed hash - only whether the SCRIPT is present.
      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the PR head commit
        # fetch-depth 0 above pulls this repo's full history but not a
        # fork's (or an as-yet-unmerged) ref - fetch head.sha explicitly so
        # it's reachable for the diff below.
        run: git fetch origin ${{ github.event.pull_request.head.sha }}

      - name: Restore this PR's previously observed content patch-id
        id: patchid-restore
        if: github.event.action == 'synchronize'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/prev_patch_id
          # A key guaranteed not to already exist, so this always falls
          # through to restore-keys (prefix match, picks the MOST RECENT
          # save) instead of ever hitting its own key directly. Same cache
          # namespace as ci.yml's `changes` job - both are answering the
          # identical "did this PR's patch change" question, so whichever
          # workflow runs first primes the cache for the other.
          key: unused-${{ github.run_id }}
          restore-keys: |
            ci-patchid-pr-${{ github.event.pull_request.number }}-

      - name: Compare against the last observed patch-id
        id: diff
        run: |
          NEW=$(bin/patch_id_hash "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "content patch-id: $NEW"
          if [ "${{ github.event.action }}" = "synchronize" ] && \
             [ -f /tmp/prev_patch_id ] && \
             [ "$(cat /tmp/prev_patch_id)" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "$NEW" > /tmp/prev_patch_id

      - name: Save this push's content patch-id for the next push to compare against
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/prev_patch_id
          key: ci-patchid-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}

  claude-review:
    needs: [content-check]
    # jnasbyupgrade's own PRs only, skip drafts (don't spend API/CI on
    # unfinished PRs), and skip a pure rebase-cascade push (see
    # content-check above - nothing new to review).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == 'jnasbyupgrade' &&
      needs.content-check.outputs.content_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write   # post the review comments
      checks: read           # read sibling check-runs for the cost gate
    steps:
      # COST GATE: the paid Claude review is the last thing to run. Wait for the
      # PR head's OTHER check-runs to finish and only proceed if they are clean.
      # If any sibling check failed we skip the review to avoid spending money
      # reviewing a PR that is already known-broken. Uniform across all repos:
      # it discovers sibling checks dynamically (no per-repo workflow names).
      #   - decision=run  : all sibling checks completed with a good conclusion,
      #                     OR no sibling checks exist after a short grace window
      #                     (nothing to gate on), OR the poll timed out is treated
      #                     as skip (see below).
      #   - decision=skip : at least one sibling check failed/cancelled/etc, or
      #                     we timed out waiting for still-pending checks.
      # We exclude this workflow's own check-run (job name `claude-review`) so the
      # gate never waits on or fails because of itself.
      - name: Wait for CI; skip the paid review if any check failed
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          decision=skip
          for i in $(seq 1 72); do   # ~24 min max
            json=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
                     --jq '[.check_runs[] | select(.name != "claude-review")]' 2>/dev/null) || json=''
            [ -z "$json" ] && { sleep 20; continue; }
            total=$(jq 'length' <<<"$json")
            if [ "$total" -eq 0 ]; then
              [ "$i" -ge 9 ] && { decision=run; break; }   # ~3 min grace: nothing to gate on
              sleep 20; continue
            fi
            pending=$(jq '[.[]|select(.status!="completed")]|length' <<<"$json")
            if [ "$pending" -eq 0 ]; then
              bad=$(jq '[.[]|select((.conclusion//"")|test("^(failure|cancelled|timed_out|action_required|stale)$"))]|length' <<<"$json")
              [ "$bad" -eq 0 ] && decision=run || decision=skip
              break
            fi
            sleep 20
          done
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "gate decision: $decision"

      - name: Check out base ref
        if: steps.gate.outputs.decision == 'run'
        # Intentionally tracks the major-version tag (not a pinned SHA) so
        # upstream fixes are picked up automatically. No repository:/ref:
        # override - see the SECURITY comment at the top of this file for why.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        if: steps.gate.outputs.decision == 'run'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Provide github_token so the action uses it directly for GitHub API
          # calls instead of the OIDC->GitHub-App-token exchange, which 401s under
          # pull_request_target. GITHUB_TOKEN is repo/workflow-scoped (independent
          # of the actor's role) and has pull-requests: write here.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # A `prompt:` input puts the action in "automation mode", which by
          # default posts nothing until the whole run finishes -- there's no
          # visibility into a review that runs long. track_progress forces a
          # tracking PR comment with a live checklist that updates as Claude
          # works, so a slow run is visible instead of silent.
          track_progress: true
          # NOTE: plugin_marketplaces can't be pinned — it tracks the
          # marketplace repo's default branch (upstream anthropics/claude-code).
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is required: without it, the code-review plugin only
          # prints its findings to the job log and never posts anything to
          # the PR (confirmed by capturing the hidden SDK transcript on a
          # canary PR in pgxntool-test: the review correctly found an
          # injected bug but ended with "No `--comment` argument was
          # provided, so no GitHub comments were posted"). Every review run
          # before this fix has been silently invisible on GitHub.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
